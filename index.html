<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manish Barma | Junior Video Editor</title>

    <meta name="description"
          content="Manish Barma is a Junior Video Editor specializing in cinematic editing, color grading, storytelling and motion graphics.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #08090d;
            color: #f5f5f5;
            font-family: "Inter", sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 90%);
            margin: auto;
        }

        /* NAVIGATION */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(8, 9, 13, 0.75);
            backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .nav-inner {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #777;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #a7a7ad;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        /* HERO */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding-top: 100px;

            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            background: rgba(100, 100, 255, 0.08);

            filter: blur(120px);

            border-radius: 50%;

            top: 20%;
            left: -150px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .availability {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 7px 13px;

            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;

            color: #bdbdc4;
            font-size: 13px;

            margin-bottom: 25px;
        }

        .dot {
            width: 7px;
            height: 7px;

            background: #65d98b;

            border-radius: 50%;
        }

        h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: clamp(50px, 8vw, 95px);

            line-height: 0.95;

            letter-spacing: -5px;

            max-width: 900px;

            margin-bottom: 30px;
        }

        h1 span {
            color: #777b86;
        }

        .hero-description {
            max-width: 650px;

            color: #9b9da6;

            font-size: 18px;

            line-height: 1.8;

            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            gap: 14px;

            flex-wrap: wrap;
        }

        .button {
            padding: 13px 21px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            border: 1px solid rgba(255,255,255,0.12);

            transition: 0.3s;
        }

        .button.primary {
            background: white;
            color: black;
        }

        .button.primary:hover {
            transform: translateY(-2px);
            background: #e8e8e8;
        }

        .button.secondary {
            color: #d0d0d5;
        }

        .button.secondary:hover {
            background: rgba(255,255,255,0.06);
        }

        /* GENERAL SECTIONS */

        section {
            padding: 110px 0;
        }

        .section-label {
            color: #777b86;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        .section-title {
            font-family: "Space Grotesk", sans-serif;

            font-size: clamp(34px, 5vw, 55px);

            letter-spacing: -2px;

            margin-bottom: 25px;
        }

        .section-description {
            color: #9698a1;

            max-width: 700px;

            font-size: 16px;

            line-height: 1.8;
        }

        /* ABOUT */

        .about-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 70px;

            margin-top: 50px;
        }

        .about-text p {
            color: #a4a6ae;

            margin-bottom: 20px;

            font-size: 16px;

            line-height: 1.9;
        }

        .info-list {
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .info-item {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 18px 0;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            font-size: 14px;
        }

        .info-item span:first-child {
            color: #666a74;
        }

        .info-item span:last-child {
            color: #ddd;

            text-align: right;
        }

        /* SKILLS */

        .skills-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;

            margin-top: 50px;
        }

        .skill {
            padding: 25px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 12px;

            background: rgba(255,255,255,0.015);

            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-4px);

            border-color: rgba(255,255,255,0.18);
        }

        .skill h3 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 19px;

            margin-bottom: 8px;
        }

        .skill p {
            color: #858892;

            font-size: 14px;

            line-height: 1.7;
        }

        /* SOFTWARE */

        .software-list {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 40px;
        }

        .software {
            padding: 11px 17px;

            border: 1px solid rgba(255,255,255,0.09);

            border-radius: 7px;

            color: #b9bbc2;

            font-size: 14px;
        }

        /* EXPERIENCE */

        .experience {
            margin-top: 50px;

            border-left: 1px solid rgba(255,255,255,0.1);

            padding-left: 30px;
        }

        .experience-item {
            position: relative;

            margin-bottom: 50px;
        }

        .experience-item::before {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #aaa;

            left: -35px;

            top: 8px;
        }

        .experience-date {
            color: #666a74;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .experience h3 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 22px;

            margin-bottom: 8px;
        }

        .experience p {
            color: #92949d;

            max-width: 650px;

            font-size: 15px;
        }

        /* CONTACT */

        .contact-box {
            margin-top: 50px;

            padding: 50px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.035),
                rgba(255,255,255,0.01)
            );
        }

        .contact-box h3 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 32px;

            margin-bottom: 12px;
        }

        .contact-box p {
            color: #8f919a;

            margin-bottom: 30px;

            max-width: 600px;
        }

        .contact-links {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }

        /* FOOTER */

        footer {
            padding: 30px 0;

            border-top: 1px solid rgba(255,255,255,0.07);

            color: #666a74;

            font-size: 13px;
        }

        footer .container {
            display: flex;

            justify-content: space-between;

            gap: 20px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .nav-links {
                display: none;
            }

            h1 {
                letter-spacing: -3px;
            }

            .about-grid,
            .skills-grid {
                grid-template-columns: 1fr;
            }

            .about-grid {
                gap: 40px;
            }

            section {
                padding: 80px 0;
            }

            .contact-box {
                padding: 30px;
            }

            footer .container {
                flex-direction: column;
            }
        }

    </style>
</head>
